# .github/workflows/ci.yml
name: FX Bias Detector CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 src/ tests/ --max-line-length=100

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Unit tests (pytest)
        run: pytest tests/unit/ -v --tb=short

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fx-bias-detector:${{ github.sha }} .

      - name: Push to ECR
        env:
          AWS_REGION: eu-west-1
          ECR_REPOSITORY: fx-bias-detector
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin \
            ${{ secrets.ECR_REGISTRY }}
          docker tag fx-bias-detector:${{ github.sha }} \
            ${{ secrets.ECR_REGISTRY }}/$ECR_REPOSITORY:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/$ECR_REPOSITORY:${{ github.sha }}

  staging-smoke-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging Airflow
        run: |
          # Trigger staging DAG run via Airflow REST API
          curl -X POST \
            "http://${{ secrets.STAGING_AIRFLOW_HOST }}/api/v1/dags/fx_bias_detector_daily/dagRuns" \
            -H "Content-Type: application/json" \
            -u "${{ secrets.AIRFLOW_USER }}:${{ secrets.AIRFLOW_PASS }}" \
            -d '{"conf": {"smoke_test": true}}'

  # Manual approval gate before production
  promote-to-production:
    needs: staging-smoke-test
    runs-on: ubuntu-latest
    environment:
      name: production      # requires manual approval in GitHub Environments
    steps:
      - name: Update production Airflow image tag
        run: |
          echo "Promoting ${{ github.sha }} to production"
          # Update Helm values or Airflow config here