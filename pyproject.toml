[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "londonopen"
version = "0.1.0"
description = "A Python-based automated trading analysis tool for MetaTrader 5, specializing in forex trading strategies around the London market opening."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "MetaTrader5; sys_platform == 'win32'",
    "pandas",
    "numpy",
    "pytz",
    "openpyxl",
    "xlrd>=2.0.1",
    "requests",
    "playwright",
    "pydantic",
    "structlog",
    "tenacity",
    "python-dotenv",
    "fastparquet>=2026.5.0",
    "pyarrow>=24.0.0",
    "ruff>=0.15.13",
]

# Flat repo: explicit discovery avoids treating ``bias_detector/`` as a second
# top-level package next to ``strategies/``.
[tool.setuptools.packages.find]
where = [".", "bias_detector/src"]
include = ["strategies*", "ingestion*", "signals*", "utils*", "runtime*"]

[tool.setuptools]
py-modules = [
    "main",
    "config",
    "session",
    "asian_range",
    "centralbank_dealers_range",
    "liquidity_sweep",
]
